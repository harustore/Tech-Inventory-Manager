kind = "web"
previewPath = "/"
title = "TechStock Inventario"
version = "1.0.0"
id = "artifacts/techstock"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18542

[services.development]
run = "pnpm --filter @workspace/techstock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/techstock", "run", "build" ]
serve = "static"
publicDir = "artifacts/techstock/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18542"
BASE_PATH = "/"
